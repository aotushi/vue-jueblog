name = "vue-jueblog"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "vue-jueblog-db"
database_id = "local"
migrations_dir = "worker/migrations"
